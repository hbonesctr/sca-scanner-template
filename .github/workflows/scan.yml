          echo "Generated report: ${REPORT_FILE}"
          ls -lah "${REPORTS_DIR}"

      - name: Commit reports to repository
        if: ${{ always() && env.COMMIT_REPORTS_ENABLED == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${REPORTS_DIR}/"
          git commit -m "Security scan reports for run ${{ github.run_number }}" || echo "No report changes to commit"
          git push

      - name: Upload consolidated reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-security-reports
          path: reports
          retention-days: 90
          if-no-files-found: error

      - name: Create release with reports
        if: ${{ always() && env.CREATE_RELEASE_ENABLED == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: scan-${{ github.run_number }}
          name: Security Scan Results - Run ${{ github.run_number }}
          body: |
            ## Security Scan Complete

            Repository: `${{ github.repository }}`
            Branch/ref: `${{ github.ref_name }}`
            Workflow run: `${{ github.run_number }}`

            ### Included Deliverables
            - Extraction summary and file inventory
            - Manifest candidate list
            - SBOM in SPDX JSON format
            - Snyk Open Source JSON results
            - Snyk monitor status/log
            - Grype JSON results
            - Semgrep JSON results
            - Audit-ready markdown report

            This release contains scanner evidence. Review scanner status fields before treating a control area as passed.
          files: |
            reports/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
