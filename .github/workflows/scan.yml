################################################################################
# DoD Security Scanner - ZIP-based Customer Software Workflow
# Author: Hector L. Bones
# Version: 2.3
# Last Updated: 2026-05-09
#
# Purpose:
# - Accept customer-provided source packages under customer-software/
# - Safely extract ZIP files into the GitHub Actions runner workspace
# - Scan the extracted source with SBOM, SCA, and SAST tools
# - Publish audit-ready outputs to reports/
# - Create GitHub Releases with full audit-ready release notes on every
#   successful scan (push or manual dispatch)
#
# Important design note:
# - Files created under /tmp/extracted exist only during workflow runtime.
# - Snyk must be run from /tmp/extracted to scan the extracted customer code.
# - Snyk Web GitHub Import will not see /tmp/extracted unless extracted code is
#   committed to the repository. This workflow uses Snyk CLI + snyk monitor to
#   create Snyk UI projects from the extracted code.
#
# Required repository secret:
# - SNYK_TOKEN
# Optional repository secret:
# - SNYK_ORG_ID  (if omitted, Snyk CLI defaults to the account's default org)
# Recommended repository settings:
# - Actions permissions: Read and write permissions
# - Allow GitHub Actions to create and approve pull requests: not required
#
# Changelog:
# v2.2 - Added actions/checkout@v4 to create-release job (fixes "not a git
#        repository" error when gh CLI attempts to create the release).
#        Corrected SNYK_ORG_ID header comment from "Required" to "Optional".
# v2.3 - Removed workflow_dispatch event guard from create-release job.
#        Release now fires automatically on every successful consolidate-reports
#        regardless of trigger type (push or workflow_dispatch). Eliminates
#        mobile Safari limitation where workflow_dispatch UI is non-functional.
################################################################################

name: DoD Security Scanner

on:
  workflow_dispatch:
    inputs:
      snyk_monitor:
        description: "Publish monitored projects into the Snyk UI using snyk monitor"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      snyk_unmanaged_fallback:
        description: "Also run Snyk unmanaged scan/monitor for C/C++ or source-only projects"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      commit_reports:
        description: "Commit generated reports back into the repository reports/ folder"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      create_release:
        description: "Retained for reference - release now always created on success"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      detection_depth:
        description: "Snyk --detection-depth value"
        required: true
        default: "10"
        type: choice
        options:
          - "4"
          - "6"
          - "8"
          - "10"
          - "12"

  push:
    paths:
      - "customer-software/**"
      - ".github/workflows/scan.yml"

permissions:
  contents: write
  actions: read

env:
  CUSTOMER_SOFTWARE_DIR: customer-software
  EXTRACTED_DIR: /tmp/extracted
  REPORTS_DIR: reports
  SNYK_DETECTION_DEPTH: ${{ inputs.detection_depth || '10' }}
  SNYK_MONITOR_ENABLED: ${{ inputs.snyk_monitor || 'true' }}
  SNYK_UNMANAGED_ENABLED: ${{ inputs.snyk_unmanaged_fallback || 'true' }}
  COMMIT_REPORTS_ENABLED: ${{ inputs.commit_reports || 'true' }}

jobs:
  prepare-extracted-code:
    name: Prepare Extracted Customer Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract customer ZIP files safely
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${EXTRACTED_DIR}"
          mkdir -p out

          echo "Repository: ${{ github.repository }}"
          echo "Branch/ref: ${{ github.ref_name }}"
          echo "Workspace: ${GITHUB_WORKSPACE}"
          echo "Customer software directory: ${CUSTOMER_SOFTWARE_DIR}"
          echo "Extraction directory: ${EXTRACTED_DIR}"

          if [ ! -d "${CUSTOMER_SOFTWARE_DIR}" ]; then
            echo "ERROR: ${CUSTOMER_SOFTWARE_DIR} does not exist." | tee out/extraction-error.txt
            exit 1
          fi

          python3 <<'PY'
          import json
          import os
          import pathlib
          import shutil
          import zipfile

          src = pathlib.Path(os.environ["CUSTOMER_SOFTWARE_DIR"]).resolve()
          dst = pathlib.Path(os.environ["EXTRACTED_DIR"]).resolve()
          dst.mkdir(parents=True, exist_ok=True)

          summary = {
              "source_directory": str(src),
              "extraction_directory": str(dst),
              "zip_files_found": [],
              "zip_files_extracted": [],
              "non_zip_content_copied": False,
              "errors": []
          }

          def safe_extract_zip(zip_path: pathlib.Path, target_dir: pathlib.Path):
              target_dir.mkdir(parents=True, exist_ok=True)
              target_root = target_dir.resolve()

              with zipfile.ZipFile(zip_path, "r") as zf:
                  for member in zf.infolist():
                      member_target = (target_root / member.filename).resolve()

                      if not str(member_target).startswith(str(target_root) + os.sep) and member_target != target_root:
                          raise RuntimeError(f"Unsafe ZIP path detected: {member.filename}")

                  zf.extractall(target_root)

          zip_files = sorted(src.rglob("*.zip"))
          summary["zip_files_found"] = [str(p.relative_to(src)) for p in zip_files]

          for index, zip_path in enumerate(zip_files, start=1):
              target_name = f"{index:02d}-{zip_path.stem}"
              target_dir = dst / target_name

              try:
                  safe_extract_zip(zip_path, target_dir)
                  summary["zip_files_extracted"].append({
                      "zip": str(zip_path.relative_to(src)),
                      "target": str(target_dir)
                  })
              except Exception as exc:
                  summary["errors"].append({
                      "zip": str(zip_path),
                      "error": str(exc)
                  })

          # Browser-friendly fallback:
          # If someone uploads already-extracted source under customer-software/,
          # copy non-ZIP content into /tmp/extracted/repository-content.
          repository_content = dst / "repository-content"
          copied_any = False

          for item in src.iterdir():
              if item.name.startswith(".git"):
                  continue
              if item.is_file() and item.suffix.lower() == ".zip":
                  continue

              target = repository_content / item.name

              if item.is_dir():
                  shutil.copytree(item, target, dirs_exist_ok=True)
                  copied_any = True
              elif item.is_file():
                  repository_content.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(item, target)
                  copied_any = True

          summary["non_zip_content_copied"] = copied_any

          pathlib.Path("out").mkdir(exist_ok=True)
          pathlib.Path("out/extraction-summary.json").write_text(
              json.dumps(summary, indent=2),
              encoding="utf-8"
          )

          if summary["errors"]:
              print(json.dumps(summary, indent=2))
              raise SystemExit(1)

          print(json.dumps(summary, indent=2))
          PY

      - name: Build extraction debug inventory
        if: always()
        shell: bash
        run: |
          mkdir -p out

          echo "---- Extracted tree ----" | tee out/extracted-tree.txt
          find "${EXTRACTED_DIR}" -maxdepth 12 -type f | sort | tee -a out/extracted-tree.txt || true

          echo "---- Manifest candidates ----" | tee out/manifest-candidates.txt
          find "${EXTRACTED_DIR}" -maxdepth 14 -type f \( \
            -iname "requirements*.txt" -o \
            -iname "pyproject.toml" -o \
            -iname "poetry.lock" -o \
            -iname "Pipfile" -o \
            -iname "Pipfile.lock" -o \
            -iname "setup.py" -o \
            -iname "setup.cfg" -o \
            -iname "package.json" -o \
            -iname "package-lock.json" -o \
            -iname "yarn.lock" -o \
            -iname "pnpm-lock.yaml" -o \
            -iname "pom.xml" -o \
            -iname "build.gradle" -o \
            -iname "build.gradle.kts" -o \
            -iname "*.csproj" -o \
            -iname "packages.config" -o \
            -iname "go.mod" -o \
            -iname "go.sum" -o \
            -iname "Gemfile" -o \
            -iname "Gemfile.lock" -o \
            -iname "composer.json" -o \
            -iname "composer.lock" -o \
            -iname "Cargo.toml" -o \
            -iname "Cargo.lock" -o \
            -iname "Dockerfile" -o \
            -iname "*.tf" \
          \) -print | sort | tee -a out/manifest-candidates.txt || true

          echo "---- Directory size ----" | tee out/extracted-size.txt
          du -sh "${EXTRACTED_DIR}" | tee -a out/extracted-size.txt || true

      - name: Upload extracted customer code artifact
        uses: actions/upload-artifact@v4
        with:
          name: extracted-code
          path: /tmp/extracted
          retention-days: 14

      - name: Upload extraction debug artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extraction-debug
          path: out/
          retention-days: 14

  syft-sbom:
    name: Generate SBOM with Syft
    runs-on: ubuntu-latest
    needs: prepare-extracted-code

    steps:
      - name: Download extracted customer code
        uses: actions/download-artifact@v4
        with:
          name: extracted-code
          path: /tmp/extracted

      - name: Generate SPDX SBOM
        shell: bash
        run: |
          mkdir -p out

          set +e

          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh -o /tmp/install_syft.sh
          DOWNLOAD_EXIT=$?

          if [ "${DOWNLOAD_EXIT}" -eq 0 ]; then
            sudo sh /tmp/install_syft.sh -b /usr/local/bin > out/syft-install.log 2>&1
            INSTALL_EXIT=$?
          else
            INSTALL_EXIT="${DOWNLOAD_EXIT}"
            echo "Failed to download Syft installer." > out/syft-install.log
          fi

          if command -v syft >/dev/null 2>&1; then
            syft version > out/syft-version.txt 2>&1
            syft dir:/tmp/extracted -o spdx-json=out/sbom-spdx.json > out/syft.log 2>&1
            SYFT_EXIT=$?
          else
            SYFT_EXIT=127
            echo '{"scanner":"syft","status":"NOT_EXECUTED","reason":"Syft was not installed."}' > out/sbom-spdx.json
            echo "Syft command not found." > out/syft.log
          fi

          set -e

          cat > out/syft-status.json <<JSON
          {
            "scanner": "syft",
            "command": "syft dir:/tmp/extracted -o spdx-json",
            "download_exit_code": ${DOWNLOAD_EXIT},
            "install_exit_code": ${INSTALL_EXIT},
            "scan_exit_code": ${SYFT_EXIT}
          }
          JSON

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-results
          path: out/
          retention-days: 14

  snyk-sca:
    name: Snyk Open Source Scan and Monitor
    runs-on: ubuntu-latest
    needs: prepare-extracted-code

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download extracted customer code
        uses: actions/download-artifact@v4
        with:
          name: extracted-code
          path: /tmp/extracted

      - name: Set up Snyk CLI
        continue-on-error: true
        uses: snyk/actions/setup@master

      - name: Run Snyk test and monitor from extracted code
        shell: bash
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_ORG_ID: ${{ secrets.SNYK_ORG_ID }}
        run: |
          mkdir -p out

          echo "Snyk detection depth: ${SNYK_DETECTION_DEPTH}"
          echo "Snyk monitor enabled: ${SNYK_MONITOR_ENABLED}"
          echo "Snyk unmanaged enabled: ${SNYK_UNMANAGED_ENABLED}"
          echo "Extracted directory: ${EXTRACTED_DIR}"

          find "${EXTRACTED_DIR}" -maxdepth 14 -type f \( \
            -iname "requirements*.txt" -o \
            -iname "pyproject.toml" -o \
            -iname "poetry.lock" -o \
            -iname "Pipfile" -o \
            -iname "Pipfile.lock" -o \
            -iname "setup.py" -o \
            -iname "package.json" -o \
            -iname "package-lock.json" -o \
            -iname "pom.xml" -o \
            -iname "build.gradle" -o \
            -iname "*.csproj" -o \
            -iname "go.mod" -o \
            -iname "Gemfile" -o \
            -iname "composer.json" -o \
            -iname "Cargo.toml" \
          \) -print | sort > out/snyk-manifest-candidates.txt || true

          if [ -z "${SNYK_TOKEN:-}" ]; then
            cat > out/snyk-results.json <<'JSON'
          {
            "scanner": "snyk",
            "command": "test",
            "status": "NOT_EXECUTED",
            "reason": "GitHub secret SNYK_TOKEN is not configured."
          }
          JSON

            cat > out/snyk-test-status.json <<'JSON'
          {
            "scanner": "snyk",
            "command": "test",
            "status": "NOT_EXECUTED",
            "reason": "Missing SNYK_TOKEN"
          }
          JSON

            cat > out/snyk-monitor-status.json <<'JSON'
          {
            "scanner": "snyk",
            "command": "monitor",
            "status": "NOT_EXECUTED",
            "reason": "Missing SNYK_TOKEN"
          }
          JSON

            exit 0
          fi

          if ! command -v snyk >/dev/null 2>&1; then
            cat > out/snyk-results.json <<'JSON'
          {
            "scanner": "snyk",
            "command": "test",
            "status": "NOT_EXECUTED",
            "reason": "Snyk CLI was not installed."
          }
          JSON

            cat > out/snyk-test-status.json <<'JSON'
          {
            "scanner": "snyk",
            "command": "test",
            "status": "NOT_EXECUTED",
            "reason": "Snyk CLI command not found"
          }
          JSON

            exit 0
          fi

          snyk --version > out/snyk-version.txt 2>&1 || true

          ORG_ARGS=()
          if [ -n "${SNYK_ORG_ID:-}" ]; then
            ORG_ARGS+=(--org="${SNYK_ORG_ID}")
          fi

          set +e

          cd "${EXTRACTED_DIR}"

          snyk test \
            "${ORG_ARGS[@]}" \
            --all-projects \
            --detection-depth="${SNYK_DETECTION_DEPTH}" \
            --remote-repo-url="https://github.com/${{ github.repository }}" \
            --target-reference="${{ github.ref_name }}" \
            --json-file-output="${GITHUB_WORKSPACE}/out/snyk-results.json" \
            > "${GITHUB_WORKSPACE}/out/snyk-test.log" 2>&1

          SNYK_TEST_EXIT=$?

          if [ ! -s "${GITHUB_WORKSPACE}/out/snyk-results.json" ]; then
            cat > "${GITHUB_WORKSPACE}/out/snyk-results.json" <<JSON
          {
            "scanner": "snyk",
            "command": "test --all-projects",
            "status": "NO_VALID_OUTPUT",
            "exit_code": ${SNYK_TEST_EXIT},
            "reason": "Snyk did not produce JSON output. Exit code 3 commonly means no supported projects were detected."
          }
          JSON
          fi

          UNMANAGED_TEST_EXIT="not_run"
          if [ "${SNYK_UNMANAGED_ENABLED}" = "true" ]; then
            snyk test \
              "${ORG_ARGS[@]}" \
              --unmanaged \
              --remote-repo-url="https://github.com/${{ github.repository }}" \
              --target-reference="${{ github.ref_name }}" \
              --json-file-output="${GITHUB_WORKSPACE}/out/snyk-unmanaged-results.json" \
              > "${GITHUB_WORKSPACE}/out/snyk-unmanaged-test.log" 2>&1

            UNMANAGED_TEST_EXIT=$?

            if [ ! -s "${GITHUB_WORKSPACE}/out/snyk-unmanaged-results.json" ]; then
              cat > "${GITHUB_WORKSPACE}/out/snyk-unmanaged-results.json" <<JSON
          {
            "scanner": "snyk",
            "command": "test --unmanaged",
            "status": "NO_VALID_OUTPUT",
            "exit_code": ${UNMANAGED_TEST_EXIT}
          }
          JSON
            fi
          fi

          MONITOR_EXIT="not_run"
          UNMANAGED_MONITOR_EXIT="not_run"

          if [ "${SNYK_MONITOR_ENABLED}" = "true" ]; then
            snyk monitor \
              "${ORG_ARGS[@]}" \
              --all-projects \
              --detection-depth="${SNYK_DETECTION_DEPTH}" \
              --remote-repo-url="https://github.com/${{ github.repository }}" \
              --target-reference="${{ github.ref_name }}" \
              > "${GITHUB_WORKSPACE}/out/snyk-monitor.log" 2>&1

            MONITOR_EXIT=$?

            if [ "${SNYK_UNMANAGED_ENABLED}" = "true" ]; then
              snyk monitor \
                "${ORG_ARGS[@]}" \
                --unmanaged \
                --remote-repo-url="https://github.com/${{ github.repository }}" \
                --target-reference="${{ github.ref_name }}" \
                > "${GITHUB_WORKSPACE}/out/snyk-unmanaged-monitor.log" 2>&1

              UNMANAGED_MONITOR_EXIT=$?
            fi
          else
            echo "Snyk monitor skipped because SNYK_MONITOR_ENABLED is false." > "${GITHUB_WORKSPACE}/out/snyk-monitor.log"
          fi

          cd "${GITHUB_WORKSPACE}"

          set -e

          cat > out/snyk-test-status.json <<JSON
          {
            "scanner": "snyk",
            "command": "test",
            "all_projects_exit_code": "${SNYK_TEST_EXIT}",
            "unmanaged_exit_code": "${UNMANAGED_TEST_EXIT}"
          }
          JSON

          cat > out/snyk-monitor-status.json <<JSON
          {
            "scanner": "snyk",
            "command": "monitor",
            "monitor_enabled": "${SNYK_MONITOR_ENABLED}",
            "all_projects_exit_code": "${MONITOR_EXIT}",
            "unmanaged_exit_code": "${UNMANAGED_MONITOR_EXIT}"
          }
          JSON

      - name: Upload Snyk artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-results
          path: out/
          retention-days: 14

  grype-sca:
    name: Grype Vulnerability Scan
    runs-on: ubuntu-latest
    needs: prepare-extracted-code

    steps:
      - name: Download extracted customer code
        uses: actions/download-artifact@v4
        with:
          name: extracted-code
          path: /tmp/extracted

      - name: Run Grype filesystem scan
        shell: bash
        run: |
          mkdir -p out

          set +e

          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh -o /tmp/install_grype.sh
          DOWNLOAD_EXIT=$?

          if [ "${DOWNLOAD_EXIT}" -eq 0 ]; then
            sudo sh /tmp/install_grype.sh -b /usr/local/bin > out/grype-install.log 2>&1
            INSTALL_EXIT=$?
          else
            INSTALL_EXIT="${DOWNLOAD_EXIT}"
            echo "Failed to download Grype installer." > out/grype-install.log
          fi

          if command -v grype >/dev/null 2>&1; then
            grype version > out/grype-version.txt 2>&1
            grype dir:/tmp/extracted -o json > out/grype-results.json 2> out/grype.log
            GRYPE_EXIT=$?
          else
            GRYPE_EXIT=127
            echo '{"scanner":"grype","status":"NOT_EXECUTED","reason":"Grype was not installed."}' > out/grype-results.json
            echo "Grype command not found." > out/grype.log
          fi

          set -e

          cat > out/grype-status.json <<JSON
          {
            "scanner": "grype",
            "command": "grype dir:/tmp/extracted -o json",
            "download_exit_code": ${DOWNLOAD_EXIT},
            "install_exit_code": ${INSTALL_EXIT},
            "scan_exit_code": ${GRYPE_EXIT}
          }
          JSON

      - name: Upload Grype artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grype-results
          path: out/
          retention-days: 14

  semgrep-sast:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    needs: prepare-extracted-code

    steps:
      - name: Download extracted customer code
        uses: actions/download-artifact@v4
        with:
          name: extracted-code
          path: /tmp/extracted

      - name: Run Semgrep scan
        shell: bash
        run: |
          mkdir -p out

          set +e

          python3 -m pip install --user --upgrade semgrep > out/semgrep-install.log 2>&1
          INSTALL_EXIT=$?

          export PATH="${HOME}/.local/bin:${PATH}"

          if command -v semgrep >/dev/null 2>&1; then
            semgrep --version > out/semgrep-version.txt 2>&1

            semgrep scan \
              --config=p/ci \
              --json \
              --output=out/semgrep-results.json \
              /tmp/extracted \
              > out/semgrep.log 2>&1

            SEMGREP_EXIT=$?
          else
            SEMGREP_EXIT=127
            echo '{"scanner":"semgrep","status":"NOT_EXECUTED","reason":"Semgrep was not installed."}' > out/semgrep-results.json
            echo "Semgrep command not found." > out/semgrep.log
          fi

          set -e

          cat > out/semgrep-status.json <<JSON
          {
            "scanner": "semgrep",
            "command": "semgrep scan --config=p/ci",
            "install_exit_code": ${INSTALL_EXIT},
            "scan_exit_code": ${SEMGREP_EXIT}
          }
          JSON

      - name: Upload Semgrep artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: out/
          retention-days: 14

  consolidate-reports:
    name: Consolidate Reports
    runs-on: ubuntu-latest
    needs:
      - prepare-extracted-code
      - syft-sbom
      - snyk-sca
      - grype-sca
      - semgrep-sast
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download extraction debug artifact
        uses: actions/download-artifact@v4
        with:
          name: extraction-debug
          path: incoming/extraction-debug

      - name: Download SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom-results
          path: incoming/sbom-results

      - name: Download Snyk artifact
        uses: actions/download-artifact@v4
        with:
          name: snyk-results
          path: incoming/snyk-results

      - name: Download Grype artifact
        uses: actions/download-artifact@v4
        with:
          name: grype-results
          path: incoming/grype-results

      - name: Download Semgrep artifact
        uses: actions/download-artifact@v4
        with:
          name: semgrep-results
          path: incoming/semgrep-results

      - name: Build reports folder
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${REPORTS_DIR}"

          cp incoming/extraction-debug/extraction-summary.json "${REPORTS_DIR}/extraction-summary.json" 2>/dev/null || true
          cp incoming/extraction-debug/extracted-tree.txt "${REPORTS_DIR}/extracted-tree.txt" 2>/dev/null || true
          cp incoming/extraction-debug/manifest-candidates.txt "${REPORTS_DIR}/manifest-candidates.txt" 2>/dev/null || true
          cp incoming/extraction-debug/extracted-size.txt "${REPORTS_DIR}/extracted-size.txt" 2>/dev/null || true

          cp incoming/sbom-results/sbom-spdx.json "${REPORTS_DIR}/sbom-spdx.json" 2>/dev/null || true
          cp incoming/sbom-results/syft-status.json "${REPORTS_DIR}/syft-status.json" 2>/dev/null || true
          cp incoming/sbom-results/syft.log "${REPORTS_DIR}/syft.log" 2>/dev/null || true
          cp incoming/sbom-results/syft-version.txt "${REPORTS_DIR}/syft-version.txt" 2>/dev/null || true

          cp incoming/snyk-results/snyk-results.json "${REPORTS_DIR}/snyk-results.json" 2>/dev/null || true
          cp incoming/snyk-results/snyk-unmanaged-results.json "${REPORTS_DIR}/snyk-unmanaged-results.json" 2>/dev/null || true
          cp incoming/snyk-results/snyk-test-status.json "${REPORTS_DIR}/snyk-test-status.json" 2>/dev/null || true
          cp incoming/snyk-results/snyk-monitor-status.json "${REPORTS_DIR}/snyk-monitor-status.json" 2>/dev/null || true
          cp incoming/snyk-results/snyk-test.log "${REPORTS_DIR}/snyk-test.log" 2>/dev/null || true
          cp incoming/snyk-results/snyk-monitor.log "${REPORTS_DIR}/snyk-monitor.log" 2>/dev/null || true
          cp incoming/snyk-results/snyk-unmanaged-test.log "${REPORTS_DIR}/snyk-unmanaged-test.log" 2>/dev/null || true
          cp incoming/snyk-results/snyk-unmanaged-monitor.log "${REPORTS_DIR}/snyk-unmanaged-monitor.log" 2>/dev/null || true
          cp incoming/snyk-results/snyk-manifest-candidates.txt "${REPORTS_DIR}/snyk-manifest-candidates.txt" 2>/dev/null || true
          cp incoming/snyk-results/snyk-version.txt "${REPORTS_DIR}/snyk-version.txt" 2>/dev/null || true

          cp incoming/grype-results/grype-results.json "${REPORTS_DIR}/grype-results.json" 2>/dev/null || true
          cp incoming/grype-results/grype-status.json "${REPORTS_DIR}/grype-status.json" 2>/dev/null || true
          cp incoming/grype-results/grype.log "${REPORTS_DIR}/grype.log" 2>/dev/null || true
          cp incoming/grype-results/grype-version.txt "${REPORTS_DIR}/grype-version.txt" 2>/dev/null || true

          cp incoming/semgrep-results/semgrep-results.json "${REPORTS_DIR}/semgrep-results.json" 2>/dev/null || true
          cp incoming/semgrep-results/semgrep-status.json "${REPORTS_DIR}/semgrep-status.json" 2>/dev/null || true
          cp incoming/semgrep-results/semgrep.log "${REPORTS_DIR}/semgrep.log" 2>/dev/null || true
          cp incoming/semgrep-results/semgrep-version.txt "${REPORTS_DIR}/semgrep-version.txt" 2>/dev/null || true

          python3 <<'PY'
          import datetime
          import json
          import os
          import pathlib

          reports = pathlib.Path(os.environ.get("REPORTS_DIR", "reports"))
          reports.mkdir(exist_ok=True)

          def read_text(name):
              path = reports / name
              if path.exists():
                  return path.read_text(encoding="utf-8", errors="replace")
              return ""

          def read_json(name):
              path = reports / name
              if not path.exists():
                  return None
              try:
                  return json.loads(path.read_text(encoding="utf-8", errors="replace"))
              except Exception as exc:
                  return {"parse_error": str(exc)}

          def file_state(name):
              path = reports / name
              if path.exists() and path.stat().st_size > 0:
                  return "PRESENT"
              return "MISSING"

          run_number = os.environ.get("GITHUB_RUN_NUMBER", "unknown")
          repository = os.environ.get("GITHUB_REPOSITORY", "unknown")
          ref_name = os.environ.get("GITHUB_REF_NAME", "unknown")
          sha = os.environ.get("GITHUB_SHA", "unknown")

          extraction = read_json("extraction-summary.json") or {}
          snyk_test = read_json("snyk-test-status.json") or {}
          snyk_monitor = read_json("snyk-monitor-status.json") or {}
          syft = read_json("syft-status.json") or {}
          grype = read_json("grype-status.json") or {}
          semgrep = read_json("semgrep-status.json") or {}

          manifest_text = read_text("manifest-candidates.txt")
          manifest_count = len([line for line in manifest_text.splitlines() if line.strip() and not line.startswith("----")])

          lines = []
          lines.append(f"# Security Scan Report - Run {run_number}")
          lines.append("")
          lines.append(f"- Repository: `{repository}`")
          lines.append(f"- Branch/Ref: `{ref_name}`")
          lines.append(f"- Commit: `{sha}`")
          lines.append(f"- Generated UTC: `{datetime.datetime.utcnow().isoformat()}Z`")
          lines.append("")
          lines.append("## Executive Summary")
          lines.append("")
          lines.append("| Component | Status | Evidence |")
          lines.append("|---|---:|---|")
          lines.append(f"| Extraction | {file_state('extraction-summary.json')} | `reports/extraction-summary.json` |")
          lines.append(f"| Manifest Candidates | {manifest_count} found | `reports/manifest-candidates.txt` |")
          lines.append(f"| Syft SBOM | {file_state('sbom-spdx.json')} | `reports/sbom-spdx.json` |")
          lines.append(f"| Snyk Test | all-projects exit `{snyk_test.get('all_projects_exit_code', 'unknown')}`, unmanaged exit `{snyk_test.get('unmanaged_exit_code', 'unknown')}` | `reports/snyk-results.json`, `reports/snyk-unmanaged-results.json` |")
          lines.append(f"| Snyk Monitor | all-projects exit `{snyk_monitor.get('all_projects_exit_code', 'unknown')}`, unmanaged exit `{snyk_monitor.get('unmanaged_exit_code', 'unknown')}` | `reports/snyk-monitor.log`, `reports/snyk-unmanaged-monitor.log` |")
          lines.append(f"| Grype | scan exit `{grype.get('scan_exit_code', 'unknown')}` | `reports/grype-results.json` |")
          lines.append(f"| Semgrep | scan exit `{semgrep.get('scan_exit_code', 'unknown')}` | `reports/semgrep-results.json` |")
          lines.append("")
          lines.append("## ZIP Extraction")
          lines.append("")
          lines.append(f"- ZIP files found: `{len(extraction.get('zip_files_found', []))}`")
          lines.append(f"- ZIP files extracted: `{len(extraction.get('zip_files_extracted', []))}`")
          lines.append(f"- Non-ZIP content copied: `{extraction.get('non_zip_content_copied', 'unknown')}`")
          lines.append("")
          lines.append("## Snyk UI Notes")
          lines.append("")
          lines.append("- For Snyk projects to appear in the Snyk web UI, `snyk monitor` must complete successfully.")
          lines.append("- If `snyk monitor --all-projects` returns exit code `3`, Snyk did not detect supported package manifests.")
          lines.append("- This workflow also runs `snyk monitor --unmanaged` when enabled, which is useful for C/C++ or source-only archives.")
          lines.append("- Confirm that GitHub repository secrets `SNYK_TOKEN` and optionally `SNYK_ORG_ID` are configured.")
          lines.append("")
          lines.append("## Key Files")
          lines.append("")
          lines.append("- `reports/manifest-candidates.txt`")
          lines.append("- `reports/snyk-results.json`")
          lines.append("- `reports/snyk-unmanaged-results.json`")
          lines.append("- `reports/snyk-monitor.log`")
          lines.append("- `reports/snyk-unmanaged-monitor.log`")
          lines.append("- `reports/grype-results.json`")
          lines.append("- `reports/semgrep-results.json`")
          lines.append("- `reports/sbom-spdx.json`")
          lines.append("")

          report_name = f"SCA-Report-Run-{run_number}.md"
          (reports / report_name).write_text("\n".join(lines), encoding="utf-8")
          (reports / "Security-Scan-Report-Latest.md").write_text("\n".join(lines), encoding="utf-8")
          PY

      - name: Upload consolidated reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-security-reports
          path: reports/
          retention-days: 30

      - name: Commit reports to repository
        if: ${{ env.COMMIT_REPORTS_ENABLED == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add reports/

          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi

          git commit -m "Security scan reports for run ${{ github.run_number }}"

          git pull --rebase origin "${{ github.ref_name }}" || true
          git push origin "HEAD:${{ github.ref_name }}"

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: consolidate-reports
    # v2.3: Fires automatically on every successful consolidate-reports.
    # Removed workflow_dispatch event guard — mobile Safari cannot trigger
    # workflow_dispatch via browser UI (confirmed GitHub bug). Every scan
    # of customer software now produces a release for DoD audit trail.
    if: ${{ needs.consolidate-reports.result == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download consolidated reports
        uses: actions/download-artifact@v4
        with:
          name: consolidated-security-reports
          path: release-artifacts/reports

      - name: Create release archive and release notes
        shell: bash
        run: |
          set -euo pipefail

          SCAN_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          SHORT_COMMIT="${GITHUB_SHA::7}"
          SCANNER_VERSION="v2.3 Browser-Based Snyk/Semgrep/Syft/Grype"
          ARCHIVE_NAME="security-scan-reports-${{ github.run_number }}.zip"

          zip -r "${ARCHIVE_NAME}" release-artifacts/reports REFERENCES.md COMPLIANCE-OVERVIEW.md

          cat > release-notes.md <<EOF
          # DoD Security Scan Complete

          **Scan Date:** ${SCAN_DATE}
          **Commit:** ${SHORT_COMMIT}
          **Scanner Version:** ${SCANNER_VERSION}
          **Repository:** ${{ github.repository }}
          **Workflow Run:** ${{ github.run_number }}

          ## Deliverables

          - SBOM in SPDX JSON format
          - SAST Results using Semgrep
          - SCA Results using Snyk and Grype
          - Snyk monitor output for Snyk UI project creation
          - Compliance-oriented security scan report
          - Extraction inventory and manifest-candidate evidence

          ## Standards Alignment

          - DISA ASD STIG evidence support
          - NIST SP 800-53 Rev. 5 evidence support
          - NTIA SBOM Requirements support
          - CVSS v3.x vulnerability scoring support where provided by scanners

          ## Important Notes

          This workflow is designed for a GitHub Free/private-repository scanner-wrapper model.

          CodeQL is not claimed in this release because GitHub CodeQL code scanning for private
          repositories requires GitHub Advanced Security. SAST coverage is provided by Semgrep.

          If Snyk does not show a project in the Snyk UI, review:
          - reports/snyk-monitor-status.json
          - reports/snyk-monitor.log
          - reports/snyk-manifest-candidates.txt

          ## Download

          Download the attached report archive below for audit documentation.
          EOF

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh release create "security-scan-${{ github.run_number }}" \
            "security-scan-reports-${{ github.run_number }}.zip" \
            --title "DoD Security Scan Complete - Run ${{ github.run_number }}" \
            --notes-file release-notes.md
################################################################################
# APPEND THIS JOB TO scan.yml — after the create-release job
#
# DoD Security Scanner — Report Generation Job
# Version: 1.0
# Compatible with: DoD Security Scanner v2.3
#
# What this adds:
# - Reads consolidated scan reports from the consolidated-security-reports artifact
# - Reads cia-profile.yaml from the scanned repository root (if present)
# - Generates 9 report files: Developer/Analyst/Leadership × DOCX/HTML/Markdown
# - Uploads reports as a GitHub Actions artifact (security-reports-RUN#)
# - Attaches reports to the GitHub Release created by create-release
#
# Prerequisites:
# - pip: python-docx, jinja2, pyyaml (installed inline — no Docker required)
# - scripts/generate_reports.py  (add this file to your scanner template repo)
# - scripts/requirements-reports.txt (add this file to your scanner template repo)
# - cia-profile.yaml in root of SCANNED repository (optional, defaults used if absent)
#
# Artifact retention: configured in cia-profile.yaml (default: 90 days, max: 90)
################################################################################

  generate-security-reports:
    name: Generate Security Reports
    runs-on: ubuntu-latest
    needs: create-release
    if: ${{ needs.create-release.result == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download consolidated scan reports
        uses: actions/download-artifact@v4
        with:
          name: consolidated-security-reports
          path: reports/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install report generator dependencies
        shell: bash
        run: |
          pip install \
            python-docx>=1.1.2 \
            jinja2>=3.1.4 \
            pyyaml>=6.0.2 \
            --quiet

      - name: Detect CIA profile
        shell: bash
        run: |
          if [ -f "cia-profile.yaml" ]; then
            echo "CIA_PROFILE_PATH=cia-profile.yaml" >> "${GITHUB_ENV}"
            echo "[INFO] cia-profile.yaml found in repository root"
          else
            echo "CIA_PROFILE_PATH=scripts/cia-profile-default.yaml" >> "${GITHUB_ENV}"
            echo "[WARN] cia-profile.yaml not found — using default profile"
            # Copy bundled default if present
            if [ -f "scripts/cia-profile-default.yaml" ]; then
              echo "[INFO] Using scripts/cia-profile-default.yaml"
            else
              echo "[WARN] No profile found — generator will use hardcoded defaults"
              echo "CIA_PROFILE_PATH=" >> "${GITHUB_ENV}"
            fi
          fi

      - name: Generate security reports
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA:        ${{ github.sha }}
          GITHUB_REF_NAME:   ${{ github.ref_name }}
        run: |
          python3 scripts/generate_reports.py \
            --reports-dir reports/ \
            --profile-path "${CIA_PROFILE_PATH:-}" \
            --output-dir   security-reports/

      - name: List generated reports
        shell: bash
        run: |
          echo "Generated report files:"
          ls -lh security-reports/ || echo "  (none found)"

      - name: Read artifact retention setting
        shell: bash
        run: |
          # Read retention_days from cia-profile.yaml, default 90, cap at 90
          RETENTION=$(python3 -c "
          import yaml, sys
          try:
              with open('${CIA_PROFILE_PATH:-cia-profile.yaml}') as f:
                  d = yaml.safe_load(f) or {}
              days = int(d.get('pipeline', {}).get('artifact_retention_days', 90))
              print(min(max(days, 1), 90))
          except Exception:
              print(90)
          " 2>/dev/null || echo "90")
          echo "ARTIFACT_RETENTION=${RETENTION}" >> "${GITHUB_ENV}"
          echo "[INFO] Artifact retention: ${RETENTION} days"

      - name: Upload security reports artifact
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ github.run_number }}
          path: security-reports/
          retention-days: ${{ env.ARTIFACT_RETENTION }}

      - name: Attach reports to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          LATEST_TAG=$(gh release list \
            --limit 10 \
            --json tagName \
            --jq '[.[] | select(.tagName | startswith("security-scan-"))] | .[0].tagName' \
            2>/dev/null || echo "")

          if [ -z "${LATEST_TAG}" ]; then
            echo "[WARN] No security-scan release found — skipping attachment."
            exit 0
          fi

          echo "[INFO] Attaching reports to release: ${LATEST_TAG}"

          ATTACHED=0
          for f in security-reports/*.docx security-reports/*.html security-reports/*.md; do
            [ -f "${f}" ] || continue
            FILENAME=$(basename "${f}")
            if gh release upload "${LATEST_TAG}" "${f}" --clobber 2>/dev/null; then
              echo "  [OK] ${FILENAME}"
              ATTACHED=$((ATTACHED + 1))
            else
              echo "  [WARN] Could not upload ${FILENAME}"
            fi
          done

          echo "[INFO] ${ATTACHED} report(s) attached to ${LATEST_TAG}"
