          echo "✅ Report generated: reports/SCA-Report-${TIMESTAMP}.md"
      
      - name: Commit Report
        run: |
          git config user.name "SCA Bot"
          git config user.email "sca@actions"
          git pull --rebase origin ${{ github.ref_name }}
          git add reports/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📄 Report: $(date '+%Y-%m-%d %H:%M')"
            git push origin ${{ github.ref_name }}
          fi
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: scan-${{ github.run_number }}
          name: SCA Report - Run ${{ github.run_number }}
          body: |
            ## 🔍 Security Scan Complete
            
            **Timestamp:** ${{ github.event.head_commit.timestamp }}
            **Run Number:** ${{ github.run_number }}
            **Branch:** ${{ github.ref_name }}
            
            ### 📦 Package Contents:
            - ✅ SBOM (SPDX 2.3 format)
            - ✅ SAST results (CodeQL + Semgrep)
            - ✅ SCA results (Snyk + Grype)
            - ✅ Comprehensive markdown report
            
            ### 📥 Download Instructions:
            1. Scroll down to **"Assets"** section below
            2. Download individual files or all reports
            3. View detailed findings in Security & quality tab
            
            ### 🔍 View Live Findings:
            - Navigate to [Security & quality](/${{ github.repository }}/security) tab
            - Check [Workflow logs](/${{ github.repository }}/actions/runs/${{ github.run_id }})
          files: reports/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
